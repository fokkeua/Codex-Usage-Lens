name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Apple Silicon release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify runner and release tag
        run: |
          set -euo pipefail

          architecture="$(uname -m)"
          if [[ "$architecture" != "arm64" ]]; then
            echo "Expected an Apple Silicon runner, got: $architecture" >&2
            exit 1
          fi

          app_version="$(
            plutil -extract CFBundleShortVersionString raw \
              Packaging/Info.plist
          )"
          case "$app_version" in
            *.*.*)
              expected_tag="v$app_version"
              ;;
            *.*)
              expected_tag="v$app_version.0"
              ;;
            *)
              echo "Unsupported app version format: $app_version" >&2
              exit 1
              ;;
          esac

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo \
              "Tag $GITHUB_REF_NAME does not match app version $app_version; expected $expected_tag." \
              >&2
            exit 1
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test and audit release contents
        run: zsh scripts/audit-repository.sh

      - name: Build ad-hoc signed Apple Silicon archives
        env:
          ALLOW_UNNOTARIZED_RELEASE: "1"
        run: zsh scripts/package-release.sh

      - name: Create checksums
        run: |
          set -euo pipefail
          cd outputs
          shasum -a 256 \
            CodexUsageLens-app-arm64.zip \
            CodexUsageLens-source.zip \
            > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          assets=(
            outputs/CodexUsageLens-app-arm64.zip
            outputs/CodexUsageLens-source.zip
            outputs/SHA256SUMS
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --clobber
          else
            release_notes=$'## Install on Apple Silicon\n\nDownload `CodexUsageLens-app-arm64.zip`, unzip it, and move **Codex Usage Lens.app** to **Applications**.\n\nThis build is ad-hoc signed and is not notarized by Apple. On first launch, Control-click the app, choose **Open**, and confirm **Open**. If macOS still blocks it, use **System Settings → Privacy & Security → Open Anyway**.\n\nChecksums are available in `SHA256SUMS`.'

            gh release create \
              "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --verify-tag \
              --title "Codex Usage Lens ${GITHUB_REF_NAME#v}" \
              --notes "$release_notes" \
              --generate-notes \
              --latest
          fi
