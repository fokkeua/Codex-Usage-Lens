name: Bug report
description: Report a reproducible problem in Codex Usage Lens.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, prompts, account identifiers, real session
        files, local state, or unredacted home-directory paths. Report security
        vulnerabilities privately according to SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed private data from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.2 (build 6)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.7"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - Official app-server usage
        - Live OTel
        - Local session backfill
        - File import
        - Pricing
        - UI or other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data where data is required.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Remove private data and unrelated logs.
      render: shell
